name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # 必须在 macOS 上编：arm64e 的指针认证重定位只有 Apple 的 clang + ld64 会生成。
    # Linux 的 ld64.lld 拒绝 arm64e；Theos 工具链的 clang 11 又太老，
    # 产不出 __AUTH 段，装进 Preferences 会在 map_images -> readClass 里认签失败。
    # 注意 macos-14 的镜像池在这个账号下分配不到 runner，用 macos-15。
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install dpkg

      - name: 构建（arm64 + arm64e）
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-macos.sh

      - name: 检查产物
        run: |
          set -e
          DEB=$(ls com.qwq.blelogger_*_iphoneos-arm64.deb | head -1)
          echo "== $DEB =="
          dpkg-deb -c "$DEB"
          lipo -info build/var/jb/Library/PreferenceBundles/AxsBLELoggerPrefs.bundle/AxsBLELoggerPrefs
          lipo -info build/var/jb/Library/MobileSubstrate/DynamicLibraries/AxsBLELogger.dylib
          python3 scripts/check_package.py "$DEB"

      - uses: actions/upload-artifact@v4
        with:
          name: blelogger-deb
          path: "*.deb"
          if-no-files-found: error
