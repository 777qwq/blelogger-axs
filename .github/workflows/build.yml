name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # 在 Linux 上出 arm64e：用 Theos 的 iOSToolchain（Apple ld64 的 Linux 移植），
    # 而不是 ld64.lld —— 后者明确不支持 arm64e，也生成不出 __AUTH 段。
    # Settings.app 是 arm64e 进程，面板缺这个切片会在设置里报
    # incompatible architecture (have 'arm64', need 'arm64e')。
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld dpkg-dev python3 xz-utils
          sudo apt-get install -y -qq ldid || true
          clang --version | head -1

      - name: 下载 iOS 工具链
        run: |
          set -e
          curl -L --retry 3 --retry-delay 2 -o /tmp/tc.tar.xz \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz
          ls -la /tmp/tc.tar.xz
          mkdir -p /opt/tc
          tar -xJf /tmp/tc.tar.xz -C /opt/tc
          echo "== bin 目录 =="
          ls -la /opt/tc/linux/iphone/bin/ | head -40
          echo "== 找 ld64 =="
          find /opt/tc -name 'ld*' | head -20

      - name: 构建（arm64 + arm64e）
        run: |
          set -e
          chmod +x scripts/*.sh
          LD64=$(find /opt/tc -name 'ld64' | head -1)
          [ -n "$LD64" ] || LD64=$(find /opt/tc -name 'ld64-*' | head -1)
          [ -n "$LD64" ] || { echo "没有找到 ld64"; ls /opt/tc/linux/iphone/bin; exit 1; }
          echo "ld64 = $LD64"
          APPLE_LD64="$LD64" ./scripts/build-toolchain.sh

      - name: 检查产物
        run: |
          set -e
          DEB=$(ls com.qwq.blelogger_*_iphoneos-arm64.deb | head -1)
          echo "== $DEB =="
          dpkg-deb -c "$DEB"
          python3 scripts/check_package.py "$DEB"

      - uses: actions/upload-artifact@v4
        with:
          name: blelogger-deb
          path: "*.deb"
          if-no-files-found: error
